
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFeedback | Your Experience Matters</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #f8fafc;
            background:
                radial-gradient(ellipse at 15% 15%, #2563eb 0, transparent 42%),
                radial-gradient(ellipse at 85% 80%, #7c3aed 0, transparent 40%),
                linear-gradient(135deg, #0f172a, #111827 55%, #172554);
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 34px;
            border: 1px solid rgba(255,255,255,.20);
            border-radius: 26px;
            background: rgba(255,255,255,.09);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 24px 80px rgba(0,0,0,.28);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #a5f3fc;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: rgba(34,211,238,.15);
            border: 1px solid rgba(103,232,249,.3);
        }

        h1 {
            margin: 28px 0 10px;
            font-size: clamp(27px, 6vw, 36px);
            letter-spacing: -1.2px;
            line-height: 1.15;
        }

        .subtitle {
            margin: 0;
            color: #cbd5e1;
            line-height: 1.7;
            font-size: 14px;
        }

        .section-label {
            margin: 28px 0 13px;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 600;
        }

        .phrases {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .phrase {
            min-height: 54px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 13px;
            background: rgba(255,255,255,.055);
            color: #e2e8f0;
            font-size: 13px;
            cursor: pointer;
            transition: background .2s, border-color .2s, transform .2s;
        }

        .phrase:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.11);
        }

        .phrase:has(input:checked) {
            background: rgba(34,211,238,.14);
            border-color: #67e8f9;
            color: #ecfeff;
        }

        input[type="checkbox"] {
            accent-color: #22d3ee;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .suggestion-label {
            display: block;
            margin: 25px 0 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .optional {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 400;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.17);
            border-radius: 13px;
            outline: none;
            resize: vertical;
            background: rgba(15,23,42,.32);
            color: white;
            font: inherit;
            font-size: 14px;
            line-height: 1.6;
            transition: border-color .2s;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        textarea:focus {
            border-color: #67e8f9;
        }

        .submit {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 13px;
            color: #082f49;
            background: linear-gradient(100deg, #67e8f9, #a5f3fc);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(34,211,238,.18);
        }

        .footer {
            margin: 18px 0 0;
            color: #94a3b8;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 420px) {
            .card {
                padding: 23px 18px;
                border-radius: 21px;
            }

            .phrases {
                gap: 8px;
            }

            .phrase {
                padding: 10px 8px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">
            <span class="brand-mark">Q</span>
            QUICKFEEDBACK
        </div>

        <h1>How was your experience?</h1>

        <p class="subtitle">
            Your feedback helps
            <strong>{{ restaurant }}</strong>
            create a better experience for every guest.
        </p>

        <form action="{{ url_for('submit') }}" method="POST">
            <input type="hidden" name="restaurant" value="{{ restaurant }}">
            <input type="hidden" name="google_review_url"
                   value="{{ google_review_url }}">

            <p class="section-label">
                Choose the phrases that describe your visit
            </p>

            <div class="phrases">
                {% for phrase in phrases %}
                <label class="phrase">
                    <input type="checkbox" name="phrases"
                           value="{{ phrase }}">
                    <span>{{ phrase }}</span>
                </label>
                {% endfor %}
            </div>

            <label class="suggestion-label" for="suggestion">
                One thing we could improve?
                <span class="optional">(Optional)</span>
            </label>

            <textarea
                id="suggestion"
                name="suggestion"
                maxlength="1000"
                placeholder="Share a suggestion to help us serve you better..."
            ></textarea>

            <button class="submit" type="submit">
                Submit feedback →
            </button>
        </form>

        <p class="footer">
            Thoughtful feedback. Better experiences.
        </p>
    </main>
</body>
</html>
