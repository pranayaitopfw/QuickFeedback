
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You | QuickFeedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #18212f;
            padding: 30px 16px;
        }
        main {
            max-width: 420px;
            margin: 60px auto;
            padding: 32px;
            text-align: center;
            background: white;
            border-radius: 18px;
        }
        a {
            display: block;
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #167b57;
            color: white;
            text-decoration: none;
        }
        .secondary { background: #f0f3f5; color: #18212f; }
    </style>
</head>
<body>
<main>
    <h1>Thank you!</h1>
    <p>Your feedback for <strong>{{ restaurant }}</strong> has been saved.</p>

    {% if google_review_url %}
    <p>Would you also like to share your honest experience publicly?</p>
    <a href="{{ google_review_url }}"
       target="_blank" rel="noopener noreferrer">
       Write a Google review
    </a>
    {% endif %}

    <a class="secondary" href="/">Done</a>
</main>
</body>
</html>
